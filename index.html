<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ME Gantt Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2324364b'/><rect x='4' y='7' width='14' height='4' rx='1.5' fill='%23ff991f'/><rect x='10' y='14' width='18' height='4' rx='1.5' fill='%230747a6'/><rect x='6' y='21' width='12' height='4' rx='1.5' fill='%23ff991f'/></svg>"
    />

    <!-- Trello Power-Up SDK (needed when loaded inside Trello) -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <!-- DHTMLX Gantt CSS (local copy) -->
    <link
      rel="stylesheet"
      href="gantt_8.0.10_individual/codebase/dhtmlxgantt.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont,
          sans-serif;
        background: #f7f9fc;
      }

      body {
        display: flex;
        height: 100vh;
        width: 100vw;
        background: #f7f9fc;
        color: #24364b;
        overflow: hidden;
      }

      /* SIDEBAR */

      #sidebar {
        width: clamp(220px, 27vw, 340px);
        min-width: 220px;
        max-width: 340px;
        height: 100vh;
        min-height: 0;
        flex: 0 0 auto;
        border-right: 1px solid #d9e2ec;
        background: #ffffff;
        padding: 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: hidden;
      }

      #sidebar h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }

      #sidebar small {
        font-size: 11px;
        color: #24364b;
      }

      #sidebar h2 {
        font-size: 12px;
        margin: 8px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #24364b;
      }

      #projects-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding-right: 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: #f7f9fc;
      }

      .project-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .project-toggle {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 6px;
        padding: 3px 2px;
        font-size: 13px;
        cursor: pointer;
      }

      .project-toggle input {
        cursor: pointer;
      }

      .project-toggle span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-action-btn {
        border: 1px solid rgba(36, 54, 75, 0.18);
        border-radius: 999px;
        background: #ffffff;
        color: #24364b;
        cursor: pointer;
        font-size: 11px;
        line-height: 1;
        padding: 3px 6px;
      }

      .card-action-btn.needs-dates {
        border-color: rgba(255, 171, 0, 0.75);
        background: rgba(255, 171, 0, 0.18);
      }

      .card-action-btn:hover {
        border-color: rgba(36, 54, 75, 0.55);
        background: rgba(31, 111, 235, 0.08);
      }

      .card-action-btn:disabled {
        cursor: default;
        opacity: 0.35;
      }

      .card-date-editor {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 0 2px 4px 24px;
      }

      .card-date-editor.open {
        display: grid;
      }

      .card-date-editor input {
        min-width: 0;
        border: 1px solid rgba(36, 54, 75, 0.18);
        border-radius: 4px;
        background: #f7f9fc;
        color: #24364b;
        font-size: 11px;
        padding: 3px;
      }

      .card-date-editor button {
        min-width: 0;
        border: 1px solid rgba(36, 54, 75, 0.18);
        border-radius: 4px;
        background: #ffffff;
        color: #24364b;
        cursor: pointer;
        font-size: 11px;
        padding: 3px 6px;
      }

      .card-date-editor button:hover {
        border-color: rgba(36, 54, 75, 0.55);
        background: rgba(31, 111, 235, 0.08);
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .chip {
        font-size: 11px;
        padding: 3px 6px;
        border-radius: 999px;
        border: 1px solid #d9e2ec;
        background: #f7f9fc;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .chip-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .chip.active {
        border-color: #1f6feb;
        background: #eef5ff;
      }

      #project-search {
        width: 100%;
        padding: 5px 8px;
        font-size: 12px;
        border: 1px solid #d9e2ec;
        border-radius: 4px;
        background: #f7f9fc;
        color: #24364b;
        font-family: inherit;
      }

      #calendars-list {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .calendar-row {
        display: grid;
        grid-template-columns: auto auto 1fr;
        align-items: center;
        gap: 6px;
        padding: 3px 2px;
        font-size: 13px;
        cursor: pointer;
      }

      .calendar-row input {
        cursor: pointer;
      }

      .calendar-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .calendar-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #project-search:focus {
        outline: none;
        border-color: #1f6feb;
        background: #fff;
      }

      #refresh-btn,
      #pull-btn {
        padding: 6px 10px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 4px;
        border: 1px solid #1f6feb;
        background: #1f6feb;
        color: #fff;
        cursor: pointer;
        margin-top: 4px;
        min-height: 30px;
        transition: background 180ms ease, opacity 180ms ease;
      }

      #refresh-btn:disabled,
      #pull-btn:disabled {
        cursor: wait;
        opacity: 0.95;
      }

      #status {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.4;
        margin: 8px 0 0;
        padding: 8px;
        border: 1px solid #d8dee4;
        border-radius: 4px;
        background: #f6f8fa;
        color: #24292f;
        min-height: 60px;
        max-height: 160px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* MAIN GANTT AREA */

      #gantt-wrapper {
        flex: 1;
        min-width: 0; /* THIS fixes overflow */
        display: flex;
        flex-direction: column;
        overflow: hidden; /* stops leaking under sidebar */
        background: #f7f9fc;
      }

      #gantt-header {
        padding: 8px 12px;
        border-bottom: 1px solid #d9e2ec;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      #gantt-header span {
        font-size: 13px;
      }

      #range-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 11px;
      }

      #range-controls input,
      #range-controls button {
        border: 1px solid rgba(36, 54, 75, 0.18);
        border-radius: 4px;
        background: #f7f9fc;
        color: #24364b;
        font-size: 11px;
        padding: 3px 6px;
      }

      #range-controls button {
        cursor: pointer;
      }

      #range-controls button:hover {
        border-color: rgba(36, 54, 75, 0.55);
        background: rgba(31, 111, 235, 0.08);
      }

      #sidebar-toggle {
        flex: 0 0 auto;
        border: 1px solid rgba(36, 54, 75, 0.18);
        border-radius: 4px;
        background: #f7f9fc;
        color: #24364b;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 3px 8px;
        font-family: inherit;
      }

      #sidebar-toggle:hover {
        border-color: rgba(36, 54, 75, 0.55);
        background: rgba(31, 111, 235, 0.08);
      }

      body.sidebar-collapsed #sidebar {
        display: none;
      }

      #range-navigator {
        position: relative;
        flex: 1 0 100%;
        height: 42px;
        border: 1px solid rgba(31, 111, 235, 0.08);
        border-radius: 6px;
        background: #ffffff;
        overflow: hidden;
        user-select: none;
      }

      .range-nav-bar {
        position: absolute;
        height: 4px;
        border-radius: 999px;
        opacity: 0.85;
      }

      .range-nav-bar.project {
        background: rgba(255, 153, 31, 0.75);
        top: 11px;
      }

      .range-nav-bar.calendar {
        background: rgba(54, 179, 126, 0.65);
        top: 26px;
      }

      #range-window {
        position: absolute;
        top: 0;
        bottom: 0;
        border-left: 2px solid #24364b;
        border-right: 2px solid #24364b;
        background: rgba(31, 111, 235, 0.12);
        cursor: grab;
      }

      .range-handle {
        position: absolute;
        top: 7px;
        width: 10px;
        height: 28px;
        border: 1px solid rgba(36, 54, 75, 0.55);
        border-radius: 4px;
        background: rgba(36, 54, 75, 0.55);
        cursor: ew-resize;
      }

      .range-handle.left {
        left: -6px;
      }

      .range-handle.right {
        right: -6px;
      }

      /* FULL HEIGHT GANTT FIX */
      #gantt-container {
        flex: 1; /* Take all remaining vertical space */
        width: 100%;
        overflow: auto;
        display: flex; /* Allows child to stretch */
        position: relative;
        background: #f7f9fc;
      }

      #gantt {
        flex: 1; /* Stretch vertically */
        min-height: 100%; /* Force full-height canvas */
        display: block;
      }

      .gantt_grid,
      .gantt_grid_data,
      .gantt_layout_content {
        background: #ffffff !important;
        color: #24364b !important;
        font-family: inherit !important;
      }

      .gantt_row,
      .gantt_grid_head_cell,
      .gantt_task_row,
      .gantt_scale_cell,
      .gantt_task_scale,
      .gantt_grid_scale {
        background: #ffffff !important;
        color: #24364b !important;
        font-family: inherit !important;
        border-color: #e4e7ec !important;
        border-right: 1px solid #e4e7ec !important;
      }

      .gantt_task_row,
      .gantt_grid_data .gantt_row {
        border-bottom: 1px solid #eef2f6 !important;
      }

      .gantt_scale_line,
      .gantt_line,
      .gantt_grid_data .gantt_row .gantt_cell {
        border-color: #e4e7ec !important;
        background-color: #ffffff !important;
      }

      .gantt_grid_head_cell,
      .gantt_scale_cell,
      .gantt_grid_scale,
      .gantt_task_scale {
        border-color: #e4e7ec !important;
        color: #24364b !important;
        font-family: inherit !important;
        text-transform: none;
        font-size: 13px !important;
        font-weight: 600;
      }

      .gantt_task_line {
        border-radius: 4px !important;
        border: none !important;
      }

      .project-conflict-layer {
        z-index: 14;
      }

      .project-conflict-segment {
        background: rgba(255, 86, 48, 0.5);
        border-top: 2px solid #ff5630;
        border-bottom: 2px solid #ff5630;
        box-sizing: border-box;
        pointer-events: auto;
      }

      .gantt_task_content {
        color: #fff !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 6px;
      }

      .bar-text {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .bar-avatars {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
      }

      .bar-avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.85);
        background: #fff;
        color: #24364b;
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        margin-left: -5px;
        box-sizing: border-box;
        overflow: hidden;
        vertical-align: middle;
      }

      .bar-avatar:first-child {
        margin-left: 0;
      }

      img.bar-avatar {
        object-fit: cover;
      }

      .bar-avatar.bar-avatar-more {
        background: rgba(255, 255, 255, 0.9);
        color: #344054;
      }

      .gantt_task_progress {
        border-radius: 4px !important;
        border: none !important;
      }

      .gantt-grid-label {
        color: #24364b;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
      }

      .gantt-grid-label.company-group-label {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        color: #475467;
      }

      #gantt .gantt_task_line.company-group-task {
        background: transparent;
        border-color: transparent;
        pointer-events: none;
      }

      #gantt .gantt_task_line.company-group-task .gantt_task_content {
        display: none;
      }

      .gantt_marker_area {
        z-index: 40 !important;
        pointer-events: none;
      }

      .gantt_marker.today-marker {
        background: #ff3333 !important;
        width: 2px !important;
        z-index: 41 !important;
      }

      .gantt_marker.today-marker .gantt_marker_content {
        background: #ff3333;
        border-radius: 3px;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 1px 4px;
      }

      .today-line-overlay {
        position: absolute;
        top: 0;
        width: 2px;
        background: #ff3333;
        z-index: 45;
        pointer-events: none;
      }

      .today-line-overlay::before {
        content: "Today";
        position: absolute;
        top: 0;
        left: 4px;
        border-radius: 3px;
        background: #ff3333;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        padding: 2px 4px;
        white-space: nowrap;
      }

      .gantt_tree_icon.gantt_file {
        display: none !important;
      }

      .gantt_tree_icon.gantt_folder_open,
      .gantt_tree_icon.gantt_folder_closed {
        display: none !important;
      }

      .gantt_tree_icon.gantt_close,
      .gantt_tree_icon.gantt_open {
        width: 16px !important;
        border-radius: 4px;
        background: #eef4fb;
        color: #24364b;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        margin-right: 6px;
        vertical-align: middle;
        line-height: 1;
      }

      .gantt_tree_icon.gantt_close::after {
        content: "−";
      }

      .gantt_tree_icon.gantt_open::after {
        content: "+";
      }

      #gantt .gantt_task_line.holiday-lane {
        background: transparent;
        border-color: transparent;
        pointer-events: none; /* prevent native tooltip on lane */
      }
      #gantt .gantt_task_line.family-lane {
        background: transparent;
        border-color: transparent;
        pointer-events: none;
      }

      #gantt .gantt_task_line.holiday-task {
        height: 16px;
        margin-top: 8px;
      }

      .details-container {
        padding: 6px 8px;
        font-size: 12px;
      }
      .details-container h5 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      .details-container a {
        color: #1f6feb;
        text-decoration: none;
        font-size: 12px;
      }

      #gantt .gantt_task_line.holiday-segment {
        background: rgba(255, 86, 48, 0.8);
        border-color: rgba(255, 86, 48, 0.9);
        pointer-events: none; /* allow custom overlay segments to own hover */
      }

      .holiday-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 15;
      }

      .holiday-layer-segment {
        position: absolute;
        top: 8px;
        height: 20px;
        border-radius: 4px;
        background: rgba(255, 86, 48, 0.9);
        border: 1px solid rgba(255, 86, 48, 1);
        pointer-events: auto;
        z-index: 16;
        overflow: hidden;
      }

      .holiday-layer-label {
        display: block;
        overflow: hidden;
        padding: 2px 6px;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        line-height: 16px;
        text-overflow: ellipsis;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
        white-space: nowrap;
      }

      .holiday-tooltip {
        min-width: 180px;
        max-width: 240px;
        background: #fff;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        box-shadow: 0 4px 12px rgba(23, 43, 77, 0.2);
        overflow: hidden;
      }
      .holiday-tooltip-card {
        padding: 8px 10px 10px;
        display: grid;
        gap: 6px;
        font-size: 12px;
      }
      .holiday-tooltip-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: #344054;
        font-weight: 600;
      }
      .holiday-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(255, 86, 48, 0.12);
        color: #b3472c;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 11px;
        font-weight: 700;
      }
      .holiday-dates {
        font-size: 11px;
        color: #667085;
        white-space: nowrap;
      }
      .holiday-title {
        font-size: 13px;
        font-weight: 700;
        color: #1d2939;
      }
      .holiday-details {
        font-size: 12px;
        color: #475467;
        line-height: 1.4;
      }
      .holiday-muted {
        color: #667085;
        font-size: 12px;
      }
      .holiday-links a {
        color: #1f6feb;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
      }

      #gantt-empty-state {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #667085;
        pointer-events: none;
        background: rgba(244, 245, 247, 0.85);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        padding: 4px 0;
      }

      .bar-wrapper.window-anchor,
      .bar-wrapper.window-anchor .bar,
      .bar-wrapper.window-anchor .bar-label {
        display: none;
      }

      .sidebar-tree-section {
        flex: 0 0 auto;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        background: #f7f9fc;
        overflow: hidden;
        color: #24364b;
        box-shadow: inset 0 0 0 1px rgba(16, 24, 40, 0.04);
      }

      .sidebar-tree-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 8px;
        font-weight: 600;
        font-size: 13px;
        background: #eef4fb;
        cursor: pointer;
      }

      .sidebar-tree-title {
        flex: 1;
      }

      .sidebar-counts {
        display: inline-flex;
        gap: 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #24364b;
        opacity: 0.9;
        white-space: nowrap;
      }

      .sidebar-count-pill {
        border: 1px solid rgba(36, 54, 75, 0.18);
        border-radius: 999px;
        padding: 1px 6px;
        background: #ffffff;
      }

      .sidebar-count-pill.warning {
        border-color: rgba(255, 171, 0, 0.75);
        background: rgba(255, 171, 0, 0.18);
      }

      .sidebar-count-pill.clickable {
        cursor: pointer;
      }

      .sidebar-count-pill.clickable:hover {
        border-color: rgba(36, 54, 75, 0.55);
        background: rgba(31, 111, 235, 0.08);
      }

      .sidebar-count-pill.danger {
        border-color: rgba(255, 86, 48, 0.75);
        background: rgba(255, 86, 48, 0.18);
      }

      .sidebar-tree-header .toggle-icon {
        font-size: 11px;
      }

      .sidebar-tree-list {
        padding: 4px 8px 8px;
        background: #ffffff;
      }

      .sidebar-list-header {
        font-size: 12px;
        margin: 6px 0 2px;
        color: #24364b;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        background: #f7f9fc;
        padding: 4px 6px;
        border-radius: 4px;
      }

      .sidebar-list-cards {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        padding-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <div>
        <h1>ME Gantt Engine</h1>
        <small>Hellicopter View of ME & LRL Projects”</small>
      </div>

      <h2>Company</h2>
      <div class="chip-row" id="company-chips">
        <!-- chips inserted by JS -->
      </div>

      <h2>Projects</h2>
      <input
        type="search"
        id="project-search"
        placeholder="Filter projects…"
        autocomplete="off"
      />
      <div id="projects-list">
        <!-- checkboxes inserted by JS -->
      </div>


      <div class="sidebar-tree-section" id="calendars-section">
        <div class="sidebar-tree-header" id="calendars-header">
